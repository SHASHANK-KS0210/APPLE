name: Java DevSecOps CI Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

# ==========================================================
# JOB-1 VALIDATION
# ==========================================================

  validation:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Verify Checkout
        run: |
          pwd
          ls -ltr

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Verify Java
        run: java -version

      - name: Verify Maven
        run: mvn -version

      - name: Download Dependencies
        run: mvn dependency:resolve


# ==========================================================
# JOB-2 BUILD
# ==========================================================

  build:

    needs: validation

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Compile
        run: mvn compile

      - name: Unit Test
        run: mvn test

      - name: Generate Coverage
        run: mvn jacoco:report

      - name: Package Application
        run: mvn clean package -DskipTests

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application
          path: target/*.jar


# ==========================================================
# JOB-3 SAST
# ==========================================================

  sast:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Semgrep Scan
        uses: semgrep/semgrep-action@v1


# ==========================================================
# JOB-4 CONTAINER
# ==========================================================

  container:

    needs: sast

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: application

      - name: Verify Artifact
        run: ls -ltr

      #######################################################
      # AWS Authentication
      #######################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      #######################################################
      # Login to Amazon ECR
      #######################################################

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      #######################################################
      # Build Image
      #######################################################

      - name: Build Docker Image

        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.run_number }}

        run: |

          docker build \
          -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
          .

      #######################################################
      # Trivy
      #######################################################

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.run_number }}

      #######################################################
      # Install Syft
      #######################################################

      - name: Install Syft

        run: |

          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
          | sh -s -- -b /usr/local/bin

      #######################################################
      # Generate SBOM
      #######################################################

      - name: Generate SBOM

        run: |

          syft \
          ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.run_number }} \
          -o spdx-json > sbom.json

      #######################################################
      # Upload SBOM
      #######################################################

      - name: Upload SBOM

        uses: actions/upload-artifact@v4

        with:
          name: sbom
          path: sbom.json

      #######################################################
      # Push Image
      #######################################################

      - name: Push Docker Image

        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.run_number }}

        run: |

          docker push \
          $REGISTRY/$REPOSITORY:$IMAGE_TAG
